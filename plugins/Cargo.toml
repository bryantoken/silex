# Workspace dos plugins do Silex (compilados para WebAssembly).
#   cargo build --release --target wasm32-unknown-unknown
# O .wasm gerado em target/wasm32-unknown-unknown/release/ é instalado pelo app
# em Configurações → Plugins → Instalar plugin.
[workspace]
resolver = "2"
members = ["silex-plugin-sdk", "excel-table"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
